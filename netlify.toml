[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  # Puppeteer + Chromium need a bit more room than Netlify's default.
  # This raises memory available to the PDF-generation function.
  included_files = ["src/lib/templates/static/**"]
